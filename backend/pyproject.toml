[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-allocator-backend"
version = "0.1.0"
description = "Backend API for procurement-allocator (Screen Factory Florida)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "ortools>=9.10",
    "openai>=1.50",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "google-auth>=2.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-argument is the framework's documented
# DI pattern, not the accidental mutable-default footgun this rule targets.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
