# nginx server block for procurement-allocator.
#
# Replace every occurrence of example.com below with the real domain before
# use, then symlink/copy this file into /etc/nginx/sites-available/ (and
# sites-enabled/) on the server, `nginx -t`, `systemctl reload nginx`.
#
# certbot --nginx will edit THIS file in place on first run — it detects the
# `server_name` below, adds its own `listen 443 ssl;` block, the certificate
# directives, and an http->https redirect for the port-80 block. Do not
# hand-write any ssl_certificate/listen 443 directives here; let certbot do
# it so its renewal hooks match what it wrote.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Static frontend build, populated by `docker compose run --rm frontend`
    # (see docker-compose.yml) into deploy/frontend_dist/ on the host.
    root /path/to/procurement-allocator/deploy/frontend_dist;
    index index.html;

    # Backend API, proxied same-origin under /api/ — the SPA and the backend
    # both have top-level routes that collide by name (/projects, /suppliers,
    # /orders, /users), so the API is namespaced under /api/ at the proxy
    # only; the backend itself has no /api prefix, hence the trailing
    # slashes on both `location` and `proxy_pass` below, which together
    # strip the /api/ segment before forwarding (nginx rewrites
    # /api/projects -> /projects upstream).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        # Price-list import takes 13+ minutes end-to-end on real supplier
        # documents (measured) — well below nginx's 60s default would abort
        # the request mid-import. 20 minutes of headroom above that.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;

        # REPLACES, not appends — see docs/DEPLOYMENT.md for the full
        # rationale (ADR-0024 §10 rate limiting on /auth/login and
        # /auth/callback trusts this header only from TRUSTED_PROXY_IP, and
        # only if it is not attacker-extendable). proxy_add_x_forwarded_for
        # would append to a client-supplied header instead of replacing it,
        # letting a client forge the address the backend uses for the rate
        # limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # SPA fallback — client-side routes (e.g. /projects/:id) are not real
    # files, so unmatched paths resolve to index.html and React Router takes
    # over client-side.
    location / {
        try_files $uri /index.html;
    }
}
